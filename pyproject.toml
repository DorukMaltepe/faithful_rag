[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ragproof"
version = "0.1.0"
description = "Faithfulness regression testing for RAG pipelines: score answers with HHEM, LettuceDetect and MiniCheck, and fail CI when hallucinations creep in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Doruk Maltepe" }]
requires-python = ">=3.10"
keywords = ["rag", "llm", "hallucination", "evaluation", "faithfulness", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# The core has no runtime dependencies. Model backends are opt-in extras so the
# CLI installs in seconds and CI only pulls in torch when it actually needs it.
dependencies = []

[project.optional-dependencies]
hhem = ["torch>=2.2", "transformers>=4.44"]
lettucedetect = ["lettucedetect>=0.2"]
# MiniCheck is not published on PyPI. Install it separately:
#   pip install "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@main"
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ragproof = "ragproof.cli:main"

[project.urls]
Homepage = "https://github.com/DorukMaltepe/faithful_rag"
Issues = "https://github.com/DorukMaltepe/faithful_rag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
